name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: "Core Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -v -m "not integration and not slow"

  test-mlip:
    name: "${{ matrix.name }} Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mace
            install: --extra mace
            tests: tests/calculators/test_mace.py
          - name: chgnet
            install: --extra chgnet --extra sqsgen
            tests: >-
              tests/calculators/test_chgnet.py
              tests/tools/test_bond_lattice_parameter.py
              tests/analysis/test_annni.py
              tests/analysis/test_bain.py
              tests/analysis/test_cubic_elastic_constants.py
              tests/analysis/test_elastic_constants.py
              tests/analysis/test_eos.py
              tests/analysis/test_formation_energy.py
          - name: matgl
            install: --extra matgl
            tests: tests/calculators/test_m3gnet.py tests/calculators/test_megnet.py
          - name: sevennet
            install: --extra sevennet
            tests: tests/calculators/test_sevennet.py
          - name: uma
            install: --extra uma
            tests: tests/calculators/test_uma.py
          - name: petmad
            install: --extra petmad
            tests: tests/calculators/test_petmad.py
          - name: deepmd
            install: --extra deepmd
            extra_install: |
              uv pip install "deepmd-kit[torch]==3.1.3"
              echo "DEEPMD_MODEL=$(dp pretrained download DPA-3.2-5M 2>/dev/null)" >> "$GITHUB_ENV"
            tests: tests/calculators/test_deepmd.py
          - name: nequip
            install: --extra nequip
            extra_install: |
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/nequip-oam-s.nequip.zip" https://zenodo.org/api/records/18775904/files/NequIP-OAM-S-0.1.nequip.zip/content
              uv run nequip-compile "$HOME/nequip-oam-s.nequip.zip" "$HOME/nequip-oam-s.nequip.pth" --device cpu --mode torchscript --target ase
              echo "NEQUIP_MODEL=$HOME/nequip-oam-s.nequip.pth" >> "$GITHUB_ENV"
            tests: tests/calculators/test_nequip.py
          - name: allegro
            install: --extra allegro
            extra_install: |
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/allegro-oam-l.nequip.zip" https://zenodo.org/api/records/16980200/files/Allegro-OAM-L-0.1.nequip.zip/content
              uv run nequip-compile "$HOME/allegro-oam-l.nequip.zip" "$HOME/allegro-oam-l.nequip.pth" --device cpu --mode torchscript --target ase
              echo "ALLEGRO_MODEL=$HOME/allegro-oam-l.nequip.pth" >> "$GITHUB_ENV"
            tests: tests/calculators/test_allegro.py
          - name: eqv2
            install: --extra eqv2
            extra_install: |
              uv pip install torch_scatter==2.1.2 torch_sparse==0.6.18 --find-links https://data.pyg.org/whl/torch-2.4.1+cpu.html
            tests: tests/calculators/test_eqv2.py
          - name: esen
            install: --extra esen
            tests: tests/calculators/test_esen.py
          - name: orb
            install: --extra orb
            tests: tests/calculators/test_orb.py
          - name: phonopy
            install: --extra phonopy --extra chgnet
            tests: tests/analysis/test_phonopy.py tests/transformations/test_phonopy.py
          - name: phono3py
            install: --extra phono3py
            tests: tests/analysis/test_phono3py.py tests/transformations/test_phono3py.py
          - name: sqsgen
            install: --extra sqsgen
            tests: tests/tools/test_sqsgen.py tests/transformations/test_annni.py
          - name: calphad
            install: --extra calphad
            extra_install: |
              sudo apt-get update -qq
              sudo apt-get install -y -qq build-essential csh
              mkdir -p "$HOME/bin"
              curl -sSL --retry 5 --retry-all-errors -C - -o /tmp/atat.tar.gz https://axelvandewalle.github.io/www-avdw/atat/atat3_50.tar.gz
              tar -xzf /tmp/atat.tar.gz -C /tmp
              cd /tmp/atat && make BINDIR="$HOME/bin/" all && make BINDIR="$HOME/bin/" install
              echo "$HOME/bin" >> "$GITHUB_PATH"
            tests: >-
              tests/tools/test_stability_map.py
              tests/tools/test_cahn_hilliard.py
              tests/tools/test_sqs2tdb.py
          - name: alignn
            install: --extra alignn
            extra_install: |
              uv pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
              uv pip install dgl==2.2.1 torchdata==0.9.0 pyyaml --find-links https://data.dgl.ai/wheels/torch-2.3/repo.html --find-links https://data.dgl.ai/wheels/repo.html
            tests: tests/calculators/test_alignn.py
          - name: mattersim
            install: --extra mattersim
            tests: tests/calculators/test_mattersim.py
          - name: nequix
            install: --extra nequix
            tests: tests/calculators/test_nequix.py
          - name: newtonnet
            install: --extra newtonnet
            extra_install: |
              uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
              uv pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.9.1+cpu.html --reinstall
            tests: tests/calculators/test_newtonnet.py
          - name: grace
            install: --extra grace
            tests: tests/calculators/test_grace.py
          - name: eqnorm
            install: --extra eqnorm
            extra_install: |
              uv pip install torch==2.9.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
              uv pip install torch-scatter -f https://data.pyg.org/whl/torch-2.9.1+cpu.html --reinstall
            tests: tests/calculators/test_eqnorm.py
          - name: alphanet
            install: --extra alphanet
            extra_install: |
              uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
              uv pip install torch-scatter -f https://data.pyg.org/whl/torch-2.9.1+cpu.html --reinstall
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/alphanet-config.json" https://raw.githubusercontent.com/zmyybc/AlphaNet/jax_and_zbl/pretrained/MATPES/matpes.json
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/alphanet-model.ckpt" https://raw.githubusercontent.com/zmyybc/AlphaNet/jax_and_zbl/pretrained/MATPES/r2scan_1021.ckpt
              echo "ALPHANET_CONFIG=$HOME/alphanet-config.json" >> "$GITHUB_ENV"
              echo "ALPHANET_MODEL=$HOME/alphanet-model.ckpt" >> "$GITHUB_ENV"
            tests: tests/calculators/test_alphanet.py
          - name: gptff
            install: ""
            extra_install: |
              # GPTFF declares ase<3.29, but MaterialsFramework requires ASE 3.29 APIs.
              uv pip install --no-deps "gptff @ git+https://github.com/atomly-materials-research-lab/GPTFF.git@8a03afa5c9a09411bc4e769a0efc947ee52e32c9"
              uv pip install "torch>=2.0" scikit-learn psutil tqdm
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/gptff-model.pth" https://raw.githubusercontent.com/atomly-materials-research-lab/gptff/8a03afa5c9a09411bc4e769a0efc947ee52e32c9/pretrained/inorganic/gptff_v2.pth
              echo "GPTFF_MODEL=$HOME/gptff-model.pth" >> "$GITHUB_ENV"
            tests: tests/calculators/test_gptff.py
          - name: equflash
            install: ""
            extra_install: |
              uv pip install "GGNN @ git+https://github.com/SamsungDS/GGNN.git"
              uv pip install fairchem-core==1.10.0
              uv pip install torch-geometric e3nn cuequivariance==0.6.0 cuequivariance-torch==0.6.0
              uv pip install torch_scatter==2.1.2 torch_sparse==0.6.18 --find-links https://data.pyg.org/whl/torch-2.4.1+cpu.html
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/equflash-model.pt" "https://figshare.com/ndownloader/files/65435004" || true
              if [ -s "$HOME/equflash-model.pt" ] && ! head -c 200 "$HOME/equflash-model.pt" | grep -qi "<html"; then
                echo "EQUFLASH_MODEL=$HOME/equflash-model.pt" >> "$GITHUB_ENV"
              else
                echo "::warning::EquFlash checkpoint download from figshare failed (likely WAF-blocked); EQUFLASH_MODEL not set, tests will skip"
                rm -f "$HOME/equflash-model.pt"
              fi
            tests: tests/calculators/test_equflash.py
          - name: posegnn
            install: ""
            extra_install: |
              git clone --depth 1 https://github.com/IBM/materials.git /tmp/ibm-materials
              uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
              uv pip install torch_geometric torch_nl==0.3
              uv pip install torch_scatter torch_sparse -f https://data.pyg.org/whl/torch-2.9.1+cpu.html --reinstall
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/posegnn-model.ckpt" https://huggingface.co/ibm-research/materials.pos-egnn/resolve/main/pos-egnn.v1-6M.ckpt
              echo "POSEGNN_MODEL=$HOME/posegnn-model.ckpt" >> "$GITHUB_ENV"
            python_path: /tmp/ibm-materials/models/pos_egnn
            tests: tests/calculators/test_posegnn.py
          - name: hienet
            install: --extra hienet
            extra_install: |
              uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
              uv pip install torch-scatter -f https://data.pyg.org/whl/torch-2.9.1+cpu.html --reinstall
              curl -sSL --retry 5 --retry-all-errors -C - -o "$HOME/hienet-model.pth" https://raw.githubusercontent.com/divelab/AIRS/main/OpenMat/HIENet/checkpoints/HIENet-V3.pth
              echo "HIENET_MODEL=$HOME/hienet-model.pth" >> "$GITHUB_ENV"
            tests: tests/calculators/test_hienet.py
          - name: tace
            install: --extra tace
            tests: tests/calculators/test_tace.py
          - name: matris
            install: --extra matris
            tests: tests/calculators/test_matris.py
          - name: ce
            install: --extra ce
            tests: tests/tools/test_cluster_expansion.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen ${{ matrix.install }} --group dev

      - name: Install extra dependency from GitHub
        if: matrix.extra_install
        run: ${{ matrix.extra_install }}

      - name: Run tests
        run: uv run pytest -v -m "not slow" ${{ matrix.tests }}
        env:
          PYTHONPATH: ${{ matrix.python_path || '' }}
          HF_TOKEN: ${{ (matrix.name == 'uma' || matrix.name == 'eqv2' || matrix.name == 'esen') && secrets.HF_TOKEN || '' }}
